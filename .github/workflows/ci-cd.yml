name: LoanOS CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY:        ghcr.io
  IMAGE_NAME:      ${{ github.repository }}
  CLJ_KONDO_VER:   "2024.09.27"
  JAVA_VERSION:    "21"

jobs:
  # ── 1. Lint ───────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache Clojure deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-clj-${{ hashFiles('deps.edn') }}
          restore-keys: ${{ runner.os }}-clj-

      - name: Cache clj-kondo binary
        id: kondo-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/clj-kondo
          key: clj-kondo-${{ env.CLJ_KONDO_VER }}

      - name: Install Clojure CLI
        run: |
          curl -sL https://download.clojure.org/install/linux-install.sh -o linux-install.sh
          chmod +x linux-install.sh
          sudo ./linux-install.sh

      - name: Install clj-kondo
        if: steps.kondo-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin
          curl -sLO https://github.com/clj-kondo/clj-kondo/releases/download/v${{ env.CLJ_KONDO_VER }}/clj-kondo-${{ env.CLJ_KONDO_VER }}-linux-amd64.zip
          unzip clj-kondo-${{ env.CLJ_KONDO_VER }}-linux-amd64.zip
          mv clj-kondo ~/.local/bin/
          chmod +x ~/.local/bin/clj-kondo

      - name: Add ~/.local/bin to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Verify clj-kondo
        run: clj-kondo --version

      - name: Run clj-kondo
        run: clj-kondo --lint src test

  # ── 2. Test ───────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB:       loanmanager_test
          POSTGRES_USER:     postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache Clojure deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-clj-${{ hashFiles('deps.edn') }}
          restore-keys: ${{ runner.os }}-clj-

      - name: Install Clojure CLI
        run: |
          curl -sL https://download.clojure.org/install/linux-install.sh -o linux-install.sh
          chmod +x linux-install.sh
          sudo ./linux-install.sh

      - name: Download dependencies
        run: clojure -P

      - name: Verify migrations apply cleanly
        env:
          DATABASE_URL: "jdbc:postgresql://localhost:5432/loanmanager_test?stringtype=unspecified"
          DB_USER:      postgres
          DB_PASS:      postgres
        run: clojure -M:migrate

      - name: Run tests
        env:
          DATABASE_URL: "jdbc:postgresql://localhost:5432/loanmanager_test?stringtype=unspecified"
          DB_USER:      postgres
          DB_PASS:      postgres
          JWT_SECRET:   "test-secret-min-32-chars-for-ci-pipeline"
        run: clojure -M:test

      - name: Test summary
        if: always()
        run: |
          echo "### Test Results" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY

  # ── 3. Build uberjar ──────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache Clojure deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-clj-${{ hashFiles('deps.edn') }}
          restore-keys: ${{ runner.os }}-clj-

      - name: Install Clojure CLI
        run: |
          curl -sL https://download.clojure.org/install/linux-install.sh -o linux-install.sh
          chmod +x linux-install.sh
          sudo ./linux-install.sh

      - name: Build uberjar
        run: clojure -T:build uber

      - name: Print jar size
        run: |
          SIZE=$(du -sh target/loanmanager.jar | cut -f1)
          echo "### Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Jar size | $SIZE |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: loanmanager-jar
          path: target/loanmanager.jar
          retention-days: 7

  # ── 4. Docker build + push ────────────────────────────────────────────────────
  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Download uberjar
        uses: actions/download-artifact@v4
        with:
          name: loanmanager-jar
          path: target/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        id: docker-build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Docker image summary
        run: |
          echo "### Docker Image" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | Digest |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| latest | ${{ steps.docker-build.outputs.digest }} |" >> $GITHUB_STEP_SUMMARY

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        if: always()
        continue-on-error: true
        with:
          # Docker refs must be lowercase; env.IMAGE_NAME (github.repository)
          # preserves the repo's mixed case ("Loan_manager"), which Trivy
          # can't parse. metadata-action already lowercases correctly for
          # the actual pushed tags, so reuse its first tag instead of
          # re-deriving the ref by hand.
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: trivy-results.sarif

  # ── 5. Deploy → Staging ───────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy → Staging
    runs-on: ubuntu-latest
    needs: docker
    # Skips cleanly (instead of failing) until a real staging host is
    # configured — this repo has no staging server yet.
    if: github.ref == 'refs/heads/develop' && vars.STAGING_DEPLOY_ENABLED == 'true'
    environment:
      name: staging
      url: https://staging.loanmanager.example.com

    steps:
      # Docker refs must be lowercase; env.IMAGE_NAME (github.repository)
      # preserves the repo's mixed case ("Loan_manager"), which doesn't
      # match what was actually pushed (metadata-action lowercases it in
      # the docker job) — pull would 404 on a real host.
      - name: Set lowercase image name
        run: echo "IMAGE_NAME_LC=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Deploy to staging
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key:      ${{ secrets.STAGING_SSH_KEY }}
          script: |
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:develop
            docker stop loanmanager-staging || true
            docker rm   loanmanager-staging || true
            docker run -d \
              --name loanmanager-staging \
              --restart unless-stopped \
              -p 8080:8080 \
              -e DATABASE_URL="${{ secrets.STAGING_DATABASE_URL }}" \
              -e DB_USER="${{ secrets.STAGING_DB_USER }}" \
              -e DB_PASS="${{ secrets.STAGING_DB_PASS }}" \
              -e JWT_SECRET="${{ secrets.STAGING_JWT_SECRET }}" \
              -e LOG_FORMAT="json" \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:develop

      - name: Smoke test staging
        run: |
          sleep 15
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" \
            https://staging.loanmanager.example.com/api/v1/health/live)
          echo "Health check status: $STATUS"
          [ "$STATUS" = "200" ] || exit 1

  # ── 6. Deploy → Production ────────────────────────────────────────────────────
  deploy-production:
    name: Deploy → Production
    runs-on: ubuntu-latest
    needs: docker
    # Skips cleanly (instead of failing) until a real production host is
    # configured — set the repo variable PROD_DEPLOY_ENABLED=true once
    # PROD_HOST/PROD_USER/PROD_SSH_KEY secrets point at a real server.
    if: github.ref == 'refs/heads/main' && vars.PROD_DEPLOY_ENABLED == 'true'
    environment:
      name: production
      url: https://api.loanmanager.example.com

    steps:
      # See the matching comment in deploy-staging — docker refs must be
      # lowercase, and env.IMAGE_NAME preserves the repo's mixed case.
      - name: Set lowercase image name
        run: echo "IMAGE_NAME_LC=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Deploy to production
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key:      ${{ secrets.PROD_SSH_KEY }}
          script: |
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:latest
            docker stop loanmanager-prod || true
            docker rm   loanmanager-prod || true
            docker run -d \
              --name loanmanager-prod \
              --restart unless-stopped \
              -p 8080:8080 \
              -e DATABASE_URL="${{ secrets.PROD_DATABASE_URL }}" \
              -e DB_USER="${{ secrets.PROD_DB_USER }}" \
              -e DB_PASS="${{ secrets.PROD_DB_PASS }}" \
              -e JWT_SECRET="${{ secrets.PROD_JWT_SECRET }}" \
              -e LOG_FORMAT="json" \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:latest

      - name: Smoke test production
        run: |
          sleep 15
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" \
            https://api.loanmanager.example.com/api/v1/health/live)
          echo "Health check status: $STATUS"
          [ "$STATUS" = "200" ] || exit 1

      - name: Deployment summary
        if: always()
        run: |
          echo "### Production Deployment" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Actor  | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
