name: PR Validation

on:
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    name: Validate PR
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB:       loanmanager_test
          POSTGRES_USER:     postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Maven deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-clj-${{ hashFiles('deps.edn') }}
          restore-keys: ${{ runner.os }}-clj-

      - name: Install Clojure CLI
        run: |
          curl -sL https://download.clojure.org/install/linux-install.sh -o linux-install.sh
          chmod +x linux-install.sh
          sudo ./linux-install.sh

      - name: Install clj-kondo
        run: |
          curl -sLO https://github.com/clj-kondo/clj-kondo/releases/download/v2024.09.27/clj-kondo-2024.09.27-linux-amd64.zip
          unzip clj-kondo-2024.09.27-linux-amd64.zip
          sudo mv clj-kondo /usr/local/bin/
          clj-kondo --version

      - name: Download dependencies
        run: clojure -P

      - name: Run clj-kondo lint
        run: clj-kondo --lint src

      - name: Run tests
        env:
          DATABASE_URL: "jdbc:postgresql://localhost:5432/loanmanager_test"
          DB_USER:      postgres
          DB_PASS:      postgres
          JWT_SECRET:   "test-secret-min-32-chars-for-ci-pipeline"
        run: clojure -M:test

      - name: Verify build compiles
        run: clojure -T:build uber
