name: PR Validation

on:
  pull_request:
    branches: [main, develop]

env:
  CLJ_KONDO_VER: "2024.09.27"
  JAVA_VERSION:  "21"

jobs:
  validate:
    name: Validate PR
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB:       loanmanager_test
          POSTGRES_USER:     postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache Maven + Clojure deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-clj-${{ hashFiles('deps.edn') }}
          restore-keys: ${{ runner.os }}-clj-

      - name: Cache clj-kondo binary
        id: kondo-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/clj-kondo
          key: clj-kondo-${{ env.CLJ_KONDO_VER }}

      - name: Install Clojure CLI
        run: |
          curl -sL https://download.clojure.org/install/linux-install.sh -o linux-install.sh
          chmod +x linux-install.sh
          sudo ./linux-install.sh

      - name: Install clj-kondo
        if: steps.kondo-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin
          curl -sLO https://github.com/clj-kondo/clj-kondo/releases/download/v${{ env.CLJ_KONDO_VER }}/clj-kondo-${{ env.CLJ_KONDO_VER }}-linux-amd64.zip
          unzip clj-kondo-${{ env.CLJ_KONDO_VER }}-linux-amd64.zip
          mv clj-kondo ~/.local/bin/
          chmod +x ~/.local/bin/clj-kondo

      - name: Add ~/.local/bin to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Download dependencies
        run: clojure -P

      - name: Lint
        run: clj-kondo --lint src

      - name: Run tests
        env:
          DATABASE_URL: "jdbc:postgresql://localhost:5432/loanmanager_test"
          DB_USER:      postgres
          DB_PASS:      postgres
          JWT_SECRET:   "test-secret-min-32-chars-for-ci-pipeline"
        run: clojure -M:test

      - name: Verify build compiles
        run: clojure -T:build uber

      - name: PR summary
        if: always()
        run: |
          echo "### PR Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint  | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
