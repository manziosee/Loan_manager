version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       loanmanager
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "jdbc:postgresql://db:5432/loanmanager"
      DB_USER:      postgres
      DB_PASS:      postgres
      JWT_SECRET:   "replace-with-a-secure-secret-min-32-chars"
      PORT:         "8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
